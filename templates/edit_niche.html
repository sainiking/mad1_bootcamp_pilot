{% extends 'nav_link.html' %}

{% block title %} Add Niche - Admate {% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3>Update Your Niche Here!</h3>
        </div>
        <div class="card-body">
            <form action="{{ url_for('edit_niche', niche_id=niche.niche_id) }}" method="post" class="form">
                <div class="form-group mt-3">
                    <label for="niche_name" class="form-label">Niche Name:</label>
                    <input type="text" name="niche_name" id="niche_name" class="form-control" required value="{{ niche.name }}">
                </div>
                <div class="form-group mt-3">
                    <label for="description" class="form-label">Description:</label>
                    <textarea name="description" id="description" class="form-control" rows="5" required>{{ niche.description }}</textarea>
                </div>
                <div class="form-group mt-3">
                    <label for="category_id" class="form-label">Category:</label>
                    <select name="category_id" id="category_id" class="form-control">
                        <option>Choose...</option>
                        {% for category in categories %}
                        {% if category.category_id == niche.category_id %}
                            <option value="{{ category.category_id }}" selected>{{ category.name }}</option>
                        {% else %}
                            <option value="{{ category.category_id }}">{{ category.name }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group mt-4 text-center">
                    <button type="submit" class="btn btn-primary">Edit Niche</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
