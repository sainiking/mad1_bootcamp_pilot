{% extends 'nav_link.html' %}

{% block title %} Add Category - Admate {% endblock title %}

{% block main_content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">Add a New Category</h2>
                    <form action="{{ url_for('add_category') }}" method="post">
                        <div class="form-group mb-3">
                            <label for="title" class="form-label">Title:</label>
                            <input type="text" class="form-control" id="title" name="title" style="border-radius: 15px;" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="content" class="form-label">Content:</label>
                            <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary mt-3">Add Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock main_content %}
