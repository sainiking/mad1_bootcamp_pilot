{% extends 'nav_link.html' %}

{% block title %}
    Send Request
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Send Request</h2>
    <form method="POST" action="{{ url_for('send_request', influencer_id=influencer.id) }}">
        <div class="form-group">
            <label for="campaign_id">Select Campaign</label>
            <select class="form-control" id="campaign_id" name="campaign_id" required>
                {% for campaign in ongoing_campaigns %}
                    <option value="{{ campaign.id }}">{{ campaign.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea class="form-control" id="message" name="message" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Send Request</button>
    </form>
</div>
{% endblock content %}
