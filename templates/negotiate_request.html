{% extends 'nav_link.html' %}

{% block title %}
    Negotiate Request
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Negotiate Request</h2>
    <form method="POST" action="{{ url_for('negotiate_request', request_id=request.id) }}">
        <div class="form-group">
            <label for="message">Negotiation Request:</label>
            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Send Message</button>
    </form>
</div>
    
{% endblock content %}
