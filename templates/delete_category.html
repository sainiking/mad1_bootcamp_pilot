{% extends 'nav_link.html' %}

{% block title %} Delete Category - Admate {% endblock title %}

{% block main_content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white text-center">
                    <h4>Are You Sure to Delete this Category?</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('delete_category', category_id=category.category_id) }}" method="post" class="form">
                        <div class="form-group mt-3">
                            <label for="title" class="form-label">Category Name:</label>
                            <input type="text" name="title" id="title" class="form-control" required value="{{ category.name }}" disabled>
                        </div>
                        <div class="form-group mt-3">
                            <label for="content" class="form-label">Description:</label>
                            <textarea name="content" id="content" class="form-control" rows="5" required disabled>{{ category.description }}</textarea>
                        </div>
                        <div class="form-group mt-4 text-center">
                            <button type="submit" class="btn btn-danger">Delete Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock main_content %}
