{% extends 'nav_link.html' %}

{% block title %} Delete Niche - Admate {% endblock title %}

{% block main_content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white text-center">
                    <h4>Are You Sure to Delete this Niche?</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('delete_niche', niche_id=niche.niche_id) }}" method="post" class="form">
                        <div class="form-group mt-3">
                            <label for="niche_name" class="form-label">Niche Name:</label>
                            <input type="text" name="niche_name" id="niche_name" class="form-control" required value="{{ niche.name }}" disabled>
                        </div>
                        <div class="form-group mt-3">
                            <label for="description" class="form-label">Description:</label>
                            <textarea name="description" id="description" class="form-control" rows="5" required disabled>{{ niche.description }}</textarea>
                        </div>
                        <div class="form-group mt-3">
                            <label for="category_id" class="form-label">Category:</label>
                            <select name="category_id" id="category_id" class="form-control" disabled>
                                <option value="{{ niche.category_id }}" selected>{{ niche.category.name }}</option>
                                {% for category in categories %}
                                {% if category.category_id == niche.category_id %}
                                <option value="{{ category.category_id }}">{{ category.name }}</option>
                                {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group mt-4 text-center">
                            <button type="submit" class="btn btn-danger">Delete Niche</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock main_content %}
